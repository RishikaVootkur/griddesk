[project]
name = "griddesk"
version = "0.1.0"
description = "Customer operations agent for a simulated electric utility, with MCP tools, guardrails and a tau-bench-style evaluation"
authors = [
    { name = "RishikaVootkur", email = "111972924+RishikaVootkur@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "alembic>=1.20",
    "en-core-web-sm",
    "faker>=40",
    "httpx>=0.28",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.2",
    "mcp>=2.3",
    "numpy>=2.3,<2.5",
    "presidio-analyzer>=2.2.366",
    "presidio-anonymizer>=2.2.366",
    "psycopg[binary]>=3.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pyyaml>=6",
    "scipy>=1.18",
    "sqlalchemy>=2.1",
    "structlog>=26.1",
    "typer>=0.27",
]

[project.scripts]
griddesk = "griddesk.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]
ignore = ["S101", "S311", "RUF001"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"migrations/**" = ["E501"]
"src/griddesk/eval/taskgen.py" = ["E501", "S608"]  # scenario text and fixed SQL templates

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["griddesk"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["faker.*", "presidio_analyzer.*", "presidio_anonymizer.*", "rank_bm25.*", "scipy.*", "diskcache.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
  "db: needs a running Postgres (DATABASE_URL)",
  "live: calls a real LLM provider; skipped unless GRIDDESK_LIVE=1",
  "slow: loads the spaCy model for Presidio (about 15 s); deselect with -m 'not slow'",
]

[tool.coverage.run]
source = ["griddesk"]
branch = true

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
